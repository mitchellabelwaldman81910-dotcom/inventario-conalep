<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inventario CONALEP</title>
<style>
:root{--bg:#fff;--soft:#f4f6f5;--ink:#141817;--muted:#66706c;--line:#e1e5e3;--green:#006b54}
@media (prefers-color-scheme:dark){:root{--bg:#101413;--soft:#171d1b;--ink:#e7ecea;--muted:#94a09b;--line:#26302d;--green:#3fbf98;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px}
.w{max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
header img{height:42px}
header{flex-wrap:wrap}
.nav{margin-left:auto}
.nav{display:flex;gap:6px;align-items:center}
.nav a,.nav button{font:inherit;font-size:.8rem;font-weight:600;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav button:hover{border-color:var(--green)}
.nav a.on{background:var(--green);color:#fff;border-color:var(--green)}

header div{font-size:.78rem;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.mb{margin-top:22px;font:600 .82rem ui-monospace,Menlo,monospace;color:var(--green)}
h1{font-size:1.35rem;line-height:1.3;margin:6px 0 18px}
dl{margin:0;display:grid;grid-template-columns:minmax(0,11rem) 1fr;gap:10px 16px;border-top:1px solid var(--line);padding-top:16px}
dt{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dd{margin:0;overflow-wrap:anywhere}
@media (max-width:460px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:12px}}
input{width:100%;margin-top:20px;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink)}
ul{list-style:none;margin:14px 0 0;padding:0}
li a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
li a b{font:600 .8rem ui-monospace,Menlo,monospace;color:var(--green);margin-right:8px}
li small{display:block;color:var(--muted);font-size:.78rem}
.back{display:inline-block;margin-top:24px;color:var(--green);font-weight:600;text-decoration:none}
.credit{text-align:center;margin-top:40px}
.credit button{background:none;border:0;padding:2px 4px;font:inherit;font-size:9px;letter-spacing:.06em;color:var(--muted);opacity:.35;cursor:default}
.msg{color:var(--muted);margin-top:22px}
</style>
</head>

  const[n,...v]=r;
  m.append(el("div","mb","MARBETE "+v[0]+" · No. "+n),el("h1","",v[di]||"Artículo "+n));
  const dl=el("dl");H.forEach((h,i)=>{if(v[i]){dl.append(el("dt","",h),el("dd","",v[i]))}});m.append(dl);
  const b=el("a","back","← Buscar otro artículo");b.href="#";m.append(b);
  window.scrollTo(0,0);
}
function lista(){
  if(!m.querySelector("input"))m.innerHTML="";
  const q=el("input");q.type="search";q.placeholder="Buscar marbete, artículo, área o resguardante";
  const ul=el("ul");m.append(q,ul);
  const keys=Object.keys(I),hay=keys.map(k=>I[k].join(" ").toLowerCase());
  const draw=()=>{ul.innerHTML="";const s=q.value.trim().toLowerCase();let c=0;
    for(let i=0;i<keys.length&&c<60;i++){if(s&&!hay[i].includes(s))continue;c++;
      const r=I[keys[i]],a=el("a");a.href="#"+keys[i];a.append(el("b","",r[1]),r[di+1]||"",el("small","",r[ai+1]||""));
      const li=el("li");li.append(a);ul.append(li)}
    if(!c)ul.append(el("li","msg","Sin resultados."))};
  q.oninput=draw;draw();
}
function route(){const t=location.hash.slice(1);t?ficha(t):(m.innerHTML="",lista())}
window.onhashchange=route;
function use(d){H=d.h;I=d.i;di=H.findIndex(h=>/descrip/i.test(h));ai=H.findIndex(h=>/[áa]rea/i.test(h))}
const E=document.getElementById("d");
if(E){use(JSON.parse(E.textContent));route()}else m.append(el("p","msg","Cargando inventario…"));
fetch("inventario.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{if(!E||JSON.stringify(d.i)!==JSON.stringify(I)||JSON.stringify(d.h)!==JSON.stringify(H)){const s=m.querySelector("input")?.value;use(d);route();const q=m.querySelector("input");if(q&&s){q.value=s;q.oninput()}}})
  .catch(()=>{if(!E){m.innerHTML="";m.append(el("p","msg","No se pudo cargar el inventario. Revisa tu conexión e intenta de nuevo."))}});
</script>
</body>

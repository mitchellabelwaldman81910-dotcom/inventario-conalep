<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EAF0EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Inventario de bienes por resguardante · CONALEP Chetumal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/BricolageGrotesque-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/BigShoulders-Bold.woff" as="font" type="font/woff" crossorigin>
<title>Inventario CONALEP</title>
<script>try{var s=JSON.parse(localStorage.getItem("cnlp_set")||"{}");if(s.theme==="dark"||s.theme==="light")document.documentElement.setAttribute("data-theme",s.theme);if(s.less)document.documentElement.classList.add("lessmo");if(s.text)document.documentElement.style.fontSize=["100%","112%","125%"][s.text]||"100%"}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr">
    <button class="hdr-b" id="hb" type="button" aria-label="Atrás" hidden></button>
    <span class="hdr-logo" id="hlogo" aria-hidden="true"></span>
    <div class="hdr-t" id="htit"><b>Inventario</b><small></small></div>
    <button class="hdr-b help" id="hhelp" type="button" aria-label="Ayuda de esta pantalla" hidden></button>
    <button class="pill" id="net" type="button" aria-label="Estado de envío">…</button>
  </header>
  <div class="offl" id="offline" role="status" hidden></div>
  <main class="view" id="view"></main>
</div>

<nav class="tabs away" id="tabs" aria-label="Secciones">
  <i class="tab-ind" id="tind"></i>
  <button class="tab" type="button" data-tab="home" data-ic="home"><span>Inicio</span></button>
  <button class="tab" type="button" data-tab="search" data-ic="search"><span>Buscar</span></button>
  <button class="fab" id="fab" type="button" aria-label="Escanear un marbete"></button>
  <button class="tab" type="button" data-tab="act" data-ic="act"><span>Actividad</span></button>
  <button class="tab" type="button" data-tab="more" data-ic="more"><span>Más</span></button>
</nav>
<div class="ctx" id="ctx" hidden></div>

<div class="login" id="login" hidden>
  <div class="lg-bg"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i><div class="lg-grid"></div></div>
  <div class="lg-in">
    <div class="lg-mark" id="lmark"></div>
    <h1>Inventario</h1>
    <p>CONALEP Chetumal · Servicios Administrativos</p>
    <form class="lg-card" id="lcard" autocomplete="off">
      <label class="l">¿Quién eres?</label>
      <div class="who" role="radiogroup">
        <input type="radio" name="lu" id="lu1" value="Juan Moreno" checked><label for="lu1" data-n="Juan Moreno"><b>Juan Moreno</b></label>
        <input type="radio" name="lu" id="lu2" value="Mitchell"><label for="lu2" data-n="Mitchell"><b>Mitchell</b></label>
      </div>
      <label class="l" for="lp">Contraseña</label>
      <div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Tu contraseña"><button type="button" class="eye" id="leye" aria-label="Mostrar contraseña"></button></div>
      <div class="lg-err" id="lerr" role="alert"></div>
      <button class="btn pri" id="lb" type="submit"><span>Entrar</span></button>
      <p class="lg-note" id="lnote" hidden></p>
    </form>
  </div>
  <div class="lg-foot">Sin internet también funciona, después de entrar la primera vez.</div>
</div>

<div class="scan" id="scan" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <div class="sc-frame" aria-hidden="true"><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i><i class="laser"></i></div>
  <div class="sc-top">
    <button class="gb" id="sx" type="button" aria-label="Cerrar cámara"></button>
    <div class="sc-ttl"><b id="st"></b><small id="ss"></small></div>
    <button class="gb txt" id="szoom" type="button" aria-label="Acercar" hidden>1×</button>
    <button class="gb" id="storch" type="button" aria-label="Linterna" hidden></button>
    <button class="gb" id="skey" type="button" aria-label="Teclear número de marbete"></button>
  </div>
  <div class="sc-tip" id="stip" role="status" hidden>Acomoda el QR dentro del recuadro</div>
  <div class="sc-prog" id="sprog" hidden></div>
  <div class="sc-card"><div id="sres" aria-live="polite"></div><div class="sc-hist" id="shist" hidden></div></div>
</div>

<dialog class="sheet" id="sheet"><div class="grab" aria-hidden="true"></div><div class="sh-in" id="shin"></div></dialog>
<div class="onb" id="onb" hidden></div>
<div class="guide" id="guide" hidden></div>
<div id="print"></div>

<script>
/* aviso amable si el navegador del teléfono es demasiado viejo (no impide seguir intentando) */
(function(){try{
  var ok=!!(window.HTMLDialogElement&&HTMLDialogElement.prototype.showModal&&window.indexedDB&&Object.fromEntries&&window.fetch&&window.CSS&&CSS.supports&&CSS.supports("color","color-mix(in srgb,red,blue)"));
  if(ok)return;
  var d=document.createElement("div");d.setAttribute("role","alert");
  d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fff3cd;color:#3b2a00;border-radius:16px;padding:14px 16px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)";
  d.innerHTML="<b>Tu navegador es muy antiguo.</b><br>Esta app puede fallar o verse mal. Actualiza <b>Chrome</b> desde Play Store (o Safari desde Ajustes → General → Actualización de software) y vuelve a abrir.<br><button style=\"margin-top:10px;padding:8px 14px;border:0;border-radius:10px;background:#3b2a00;color:#fff;font:inherit\" onclick=\"this.parentNode.remove()\">Entendido</button>";
  document.addEventListener("DOMContentLoaded",function(){document.body.appendChild(d)});
}catch(e){}})();
</script>
<script src="qrdec.js"></script>
<script src="ayuda-datos.js"></script>
<script src="acentos.js"></script>
<script src="firma.js"></script>
<script src="core.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
